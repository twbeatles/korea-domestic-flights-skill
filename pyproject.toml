[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-flights"
version = "0.1.0"
description = "OpenClaw Korea Flights skill package for Interpark-backed flight search strategy workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "twbeatles" }]
license = "MIT"
keywords = ["openclaw", "flights", "korea", "interpark", "playwright"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
korea-flights = "korea_flights.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"korea-flights" = ["SKILL.md"]
"korea-flights/references" = [
  "references/domestic-airports.md",
  "references/international-airports.md",
  "references/price-alerts-schema.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
